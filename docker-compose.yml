version: "3.8"

services:
  flask_backend:
    build:
      context: ./backend/flask-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - MYSQL_HOST=mysql  
      - MYSQL_USER=root   
      - MYSQL_PASSWORD=deusto  
      - MYSQL_DATABASE=pawsitive_db  
    volumes:
      - ./backend/flask-backend:/app
    networks:
      - backend-network
    depends_on:
      - mysql  

  node_backend:
    build:
      context: ./backend/node-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017 
    volumes:
      - ./backend/node-backend:/app
    networks:
      - backend-network
    depends_on:
      - mongo  

  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app
    networks:
      - frontend-network
    depends_on:
      - api_gateway  

  api_gateway:
    build:
      context: ./api_gateway
    ports:
      - "3000:3000"
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - flask_backend
      - node_backend  


  mysql:
    image: mysql:8.0  
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: "deusto"  
      MYSQL_DATABASE: "pawsitive_db"  
    ports:
      - "3307:3306"  
    volumes:
      - mysql-data:/var/lib/mysql  
    networks:
      - backend-network

  
  mongo:
    image: mongo:latest 
    container_name: mongo-db
    ports:
      - "27017:27017"  
    volumes:
      - mongo-data:/data/db  
    networks:
      - backend-network


volumes:
  mysql-data:
    driver: local
  mongo-data:
    driver: local

networks:
  frontend-network:
  backend-network:
