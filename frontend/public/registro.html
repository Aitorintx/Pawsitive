<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAWsitive - InicioSes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" id="app-container">
        <div class="dog-container">
            <img src="{{ url_for('static', filename='images/perro.png') }}" alt="PAWsitive Logo" class="dog-image">
            
            <!-- Bocadillo de texto al lado de la boca del perro -->
            <div class="speech-bubble">
                Bienvenido a PAWsitive!
            </div>
        </div>
        <h1>PAWsitive</h1>
        <form action="/submit-your-form-handler" method="post">
            <div class="form-container">
                <div class="input-container">
                    <label class="label" for="username">Nombre:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-container">
                    <label class="label" for="correo">Correo:</label>
                    <input type="text" id="correo" name="correo" required>
                </div>
                <div class="input-container">
                    <label class="label" for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="button-between">
                    <button id="registro" class="arrow-button" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="#E0F4F1">
                            <path d="M10 17l5-5-5-5v10z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('registro').addEventListener('click', function() {
            fetch('/pantallaInicio')  // Realiza la solicitud a la ruta de registro
                .then(response => response.text())  // Recibe el contenido de la página
                .then(html => {
                    // Inserta el contenido de registro.html en el contenedor
                    const contenedorElemento = document.getElementById('app-container');
                    if (contenedorElemento){
                        contenedorElemento.innerHTML = '';  // Borra el contenido anterior
                        contenedorElemento.innerHTML = html;
                        window.history.pushState({}, '', '/pantallaInicio');
                    }
                    
                })
                .catch(error => {
                    console.warn('Error al cargar el template:', error);
                });
        });
    </script>
</body>
</html>
